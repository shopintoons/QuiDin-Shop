<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizDin - Boutique Islamique & Quiz</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Police moderne Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Barre de navigation -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-quiz">Quiz</span><span class="logo-din">Din</span>
        </div>
        <nav>
            <ul>
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#produits">Boutique</a></li>
                <li><a href="#a-propos">À propos</a></li>
            </ul>
        </nav>
        <div class="cart-icon">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Section Héro / Accueil -->
    <section id="accueil" class="hero">
        <div class="hero-content">
            <h1>Bienvenue sur <span class="highlight-yellow">Quiz</span><span class="highlight-blue">Din</span></h1>
            <p>Découvrez notre sélection d'articles islamiques de qualité et apprenez en vous amusant !</p>
            <a href="#produits" class="btn-main">Voir la boutique</a>
        </div>
    </section>

    <!-- Section Produits -->
    <section id="produits" class="container">
        <h2 class="section-title">Nos Produits</h2>
        <div class="product-grid" id="product-list">
            <!-- Les produits seront générés automatiquement par JS -->
        </div>
    </section>

    <!-- Modal Panier (Fenêtre flottante) -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Votre Panier</h2>
            <div id="cart-items">
                <p>Votre panier est vide.</p>
            </div>
            <div class="cart-footer">
                <h3>Total : <span id="cart-total">0.00</span> €</h3>
                <button class="btn-checkout" onclick="checkout()">Commander via WhatsApp</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 QuizDin. Tous droits réservés.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
